# docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    container_name: nue-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nue_user
      POSTGRES_PASSWORD: nue_pass
      POSTGRES_DB: nue_db
    ports:
      - "5432:5432"
    volumes:
      - nue_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nue_user -d nue_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nue_pgdata: